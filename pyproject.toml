[project]
name = "clipcraft"
version = "2.0.0"
description = "Turn a text into a short narrated video with AI images and subtitles (EN/PL). Author: WR"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["clipcraft/tiktokvoice.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.setuptools.package-data]
clipcraft = ["locales/*.json", "assets/*.png"]
